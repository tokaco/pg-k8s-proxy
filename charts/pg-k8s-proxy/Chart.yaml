apiVersion: v2
name: pg-k8s-proxy
description: >-
  A PostgreSQL gateway and Kubernetes operator that routes client connections to
  the instance serving the requested database.
type: application
version: 0.1.1
appVersion: 0.1.0
kubeVersion: '>=1.29.0-0'
home: https://github.com/tokaco/pg-k8s-proxy
sources:
  - https://github.com/tokaco/pg-k8s-proxy
maintainers:
  - name: tokaco
    url: https://github.com/tokaco
keywords:
  - postgresql
  - postgres
  - proxy
  - gateway
  - operator
  - database
  - routing
annotations:
  category: Database
  licenses: Apache-2.0
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: 'true'
  artifacthub.io/operatorCapabilities: Seamless Upgrades
  artifacthub.io/crds: |
    - kind: PostgresRoute
      version: v1alpha1
      name: postgresroutes.pgproxy.io
      displayName: PostgreSQL Route
      description: Maps a PostgreSQL database name to the backend instance that serves it.
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/tokaco/pg-k8s-proxy#documentation
    - name: Source
      url: https://github.com/tokaco/pg-k8s-proxy
    - name: Report an issue
      url: https://github.com/tokaco/pg-k8s-proxy/issues

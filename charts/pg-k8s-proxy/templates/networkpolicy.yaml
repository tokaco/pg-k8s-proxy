{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pg-k8s-proxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pg-k8s-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pg-k8s-proxy.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: postgresql
          protocol: TCP
      {{- with .Values.networkPolicy.allowedClients }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- /* The kubelet connects from the node, not from a pod, so no selector
           can match it and the probe port has to stay open. This is exactly why
           metrics live on their own port: they carry a database label, and only
           a separate port can be restricted while probes remain reachable. */}}
    - ports:
        - port: health
          protocol: TCP
    - ports:
        - port: metrics
          protocol: TCP
      {{- with .Values.networkPolicy.allowedScrapers }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    {{- /* The gateway must reach the API server for its informers, DNS to
           resolve backends, and every PostgreSQL backend it routes to. */}}
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with .Values.networkPolicy.egress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: postgresroutes.pgproxy.io
spec:
  group: pgproxy.io
  names:
    categories:
    - pgproxy
    kind: PostgresRoute
    listKind: PostgresRouteList
    plural: postgresroutes
    shortNames:
    - pgroute
    - pgr
    singular: postgresroute
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.database
      name: Database
      type: string
    - jsonPath: .status.endpoint
      name: Endpoint
      type: string
    - jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    - jsonPath: .status.conditions[?(@.type=="Programmed")].status
      name: Programmed
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PostgresRoute maps a PostgreSQL database name to a backend instance. The
          gateway reads the startup message of every incoming connection and forwards
          it to the backend of the route claiming that database name.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PostgresRouteSpec defines a database-name to backend mapping.
            properties:
              backend:
                description: Backend describes where matching connections are sent.
                properties:
                  address:
                    description: Address routes to an arbitrary host/port. Used when
                      type is Address.
                    properties:
                      host:
                        description: Host is a DNS name or IP address.
                        maxLength: 253
                        minLength: 1
                        type: string
                      port:
                        default: 5432
                        description: Port is the TCP port to connect to.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                    required:
                    - host
                    type: object
                  service:
                    description: Service routes to a Kubernetes Service. Used when
                      type is Service.
                    properties:
                      name:
                        description: Name of the Service.
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace of the Service. Defaults to the namespace
                          of the PostgresRoute.
                        maxLength: 63
                        type: string
                      port:
                        anyOf:
                        - type: integer
                        - type: string
                        default: "5432"
                        description: |-
                          Port is the Service port to connect to, either a port number or a named
                          port declared on the Service. Defaults to 5432.
                        x-kubernetes-int-or-string: true
                    required:
                    - name
                    type: object
                  type:
                    default: Service
                    description: Type selects which of the fields below is used.
                    enum:
                    - Service
                    - Address
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: service must be set if and only if type is Service
                  rule: 'self.type == ''Service'' ? has(self.service) : !has(self.service)'
                - message: address must be set if and only if type is Address
                  rule: 'self.type == ''Address'' ? has(self.address) : !has(self.address)'
              database:
                description: |-
                  Database is the name clients pass in the PostgreSQL startup message.
                  Defaults to the name of the PostgresRoute object.
                maxLength: 63
                pattern: ^[a-zA-Z_][a-zA-Z0-9_$-]*$
                type: string
              priority:
                default: 0
                description: |-
                  Priority breaks ties when several routes claim the same database name.
                  The highest priority wins; equal priorities fall back to the oldest object.
                format: int32
                type: integer
              targetDatabase:
                description: |-
                  TargetDatabase rewrites the database name sent on to the backend. Use it
                  when the externally visible name differs from the name on the instance.
                  Defaults to the effective value of Database.
                maxLength: 63
                pattern: ^[a-zA-Z_][a-zA-Z0-9_$-]*$
                type: string
              tls:
                description: TLS configures the proxy-to-backend connection.
                properties:
                  caSecretRef:
                    description: |-
                      CASecretRef names a Secret in the route's namespace holding the CA bundle
                      used to verify the backend certificate. Required for VerifyCA and VerifyFull.
                    properties:
                      key:
                        default: ca.crt
                        description: Key within the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: Name of the Secret.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  mode:
                    default: Disable
                    description: Mode selects the TLS behaviour towards the backend.
                    enum:
                    - Disable
                    - Require
                    - VerifyCA
                    - VerifyFull
                    type: string
                  serverName:
                    description: ServerName overrides the name verified against the
                      backend certificate.
                    maxLength: 253
                    type: string
                type: object
            required:
            - backend
            type: object
          status:
            description: PostgresRouteStatus reports the observed state of a PostgresRoute.
            properties:
              conditions:
                description: Conditions describe the current state of the route.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              conflictingRoute:
                description: |-
                  ConflictingRoute names the route that won the database name, when this
                  route was rejected for a conflict.
                type: string
              database:
                description: Database is the effective database name this route claims.
                type: string
              endpoint:
                description: Endpoint is the resolved backend address in host:port
                  form.
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation the controller
                  last acted on.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  HELM_VERSION: "v3.16.4"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Charts are pushed beside the image rather than into it, so that
  # `helm install oci://ghcr.io/<owner>/charts/pg-k8s-proxy` resolves.
  CHART_REGISTRY: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "${tag}" ]; then
            echo "::error::no tag to release"
            exit 1
          fi
          # Image and chart versions are the tag without its leading "v";
          # OCI tags and Helm chart versions must both be bare semver.
          version="${tag#v}"
          if ! echo "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag ${tag} is not semver"
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "releasing ${tag} as version ${version}" >> "${GITHUB_STEP_SUMMARY}"

  # A tag is permanent, so re-run the full suite against exactly the tagged tree
  # rather than trusting the CI run of the commit it was cut from.
  verify:
    name: Verify
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/go.sum

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Test
        working-directory: src
        run: go test -race -count=1 ./...

      - name: Lint the chart
        run: |
          helm lint charts/pg-k8s-proxy
          helm lint charts/pg-k8s-proxy --set scope.type=Namespaced

      - name: The chart version must match the tag
        run: |
          set -euo pipefail
          want="${{ needs.resolve.outputs.version }}"
          chart="$(grep -E '^version:' charts/pg-k8s-proxy/Chart.yaml | awk '{print $2}')"
          app="$(grep -E '^appVersion:' charts/pg-k8s-proxy/Chart.yaml | awk '{print $2}' | tr -d '"')"
          if [ "${chart}" != "${want}" ] || [ "${app}" != "${want}" ]; then
            echo "::error::Chart.yaml says version=${chart} appVersion=${app}, expected ${want}."
            echo "::error::release-please keeps these in step; do not tag by hand."
            exit 1
          fi

  image:
    name: Publish image
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # keyless signing with cosign
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build timestamp
        id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # A prerelease gets only its exact version: moving `latest` or a
          # floating major onto an untested build is how consumers get surprised.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.resolve.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve.outputs.tag }},enable=${{ !contains(needs.resolve.outputs.version, '-') }}
            type=semver,pattern={{major}},value=${{ needs.resolve.outputs.tag }},enable=${{ !contains(needs.resolve.outputs.version, '-') }}
            type=raw,value=latest,enable=${{ !contains(needs.resolve.outputs.version, '-') }}
          labels: |
            org.opencontainers.image.title=pg-k8s-proxy
            org.opencontainers.image.description=PostgreSQL gateway and Kubernetes operator routing connections by database name
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ needs.resolve.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.value }}
          cache-from: type=gha

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Keyless: the signature is bound to this workflow's OIDC identity, so
          # consumers can verify provenance without us holding a private key.
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Summary
        run: |
          {
            echo '### Image published'
            echo
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  chart:
    name: Publish chart
    needs: [resolve, verify, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the packaged chart to the release
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package charts/pg-k8s-proxy \
            --version "${{ needs.resolve.outputs.version }}" \
            --app-version "${{ needs.resolve.outputs.version }}" \
            --destination dist
          ls -la dist

      - name: Log in to the registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ${{ env.REGISTRY }} \
                --username ${{ github.actor }} --password-stdin

      - name: Push to the OCI registry
        id: push
        run: |
          set -euo pipefail
          chart="dist/pg-k8s-proxy-${{ needs.resolve.outputs.version }}.tgz"
          helm push "${chart}" "oci://${CHART_REGISTRY}" 2>&1 | tee /tmp/push.log
          digest="$(grep -oE 'sha256:[0-9a-f]{64}' /tmp/push.log | head -1)"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Verify the published chart installs
        run: |
          set -euo pipefail
          # Pulling it back proves the artefact is readable by a consumer, not
          # just that the push returned success.
          helm show chart "oci://${CHART_REGISTRY}/pg-k8s-proxy" \
            --version "${{ needs.resolve.outputs.version }}"
          helm template pg-k8s-proxy "oci://${CHART_REGISTRY}/pg-k8s-proxy" \
            --version "${{ needs.resolve.outputs.version }}" \
            --namespace pgproxy > /dev/null

      - name: Attach the chart to the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: dist/*.tgz
          fail_on_unmatched_files: true

      - name: Summary
        run: |
          {
            echo '### Chart published'
            echo
            echo '```bash'
            echo 'helm install pg-k8s-proxy \'
            echo "  oci://${CHART_REGISTRY}/pg-k8s-proxy \\"
            echo "  --version ${{ needs.resolve.outputs.version }} \\"
            echo '  --namespace pgproxy --create-namespace'
            echo '```'
            echo
            echo "Chart digest: \`${{ steps.push.outputs.digest }}\`"
            echo "Image digest: \`${{ needs.image.outputs.digest }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

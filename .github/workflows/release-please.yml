name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  release-please:
    name: Maintain the release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Derives the next semantic version from Conventional Commits, keeps a
      # release pull request up to date, and on merge tags the commit and
      # publishes a GitHub Release. That release is what triggers release.yml.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}

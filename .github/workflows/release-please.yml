name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  release-please:
    name: Maintain the release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Derives the next semantic version from Conventional Commits, keeps a
      # release pull request up to date, and on merge tags the commit and
      # publishes a GitHub Release. That release is what triggers release.yml.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Falls back to the built-in token, which needs "Allow GitHub Actions
          # to create and approve pull requests" enabled under Settings ->
          # Actions -> General. Supplying RELEASE_PLEASE_TOKEN instead lifts
          # that requirement and additionally lets the release pull request
          # trigger CI, which pull requests opened by the built-in token never
          # do. Neither is a gap in coverage: the release workflow re-runs the
          # whole suite against the tagged tree before it publishes anything.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}

  publish:
    name: Publish the release
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    secrets: inherit
